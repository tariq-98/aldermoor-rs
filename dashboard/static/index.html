<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aldermoor Live</title>
<meta name="description" content="Live view of Aldermoor's GitHub work: pull requests, CI, issues by phase, claims and captures.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aldermoor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#overview" aria-label="Aldermoor Live: overview">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#1a251f"/>
        <path d="M32 51V58" stroke="#d9a35b" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M32 51C23.5 49 14.5 41.5 14.5 30.5C14.5 20.5 20.5 13 27 13C30 13 31.5 15.2 32 18.2C32.5 15.2 34 13 37 13C43.5 13 49.5 20.5 49.5 30.5C49.5 41.5 40.5 49 32 51Z" fill="#d9a35b"/>
        <path d="M32 47.5V21 M32 41.5L22.5 34 M32 41.5L41.5 34 M32 33L23.5 25.8 M32 33L40.5 25.8" fill="none" stroke="#1a251f" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="wordmark">Aldermoor</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#overview" data-tab="overview"><span class="tab-icon"><span class="badge" hidden></span></span><span class="tab-label">Overview</span></a>
      <a href="#prs" data-tab="prs"><span class="tab-icon"><span class="badge" hidden></span></span><span class="tab-label">PRs</span></a>
      <a href="#issues" data-tab="issues"><span class="tab-icon"><span class="badge" hidden></span></span><span class="tab-label">Issues</span></a>
      <a href="#visuals" data-tab="visuals"><span class="tab-icon"><span class="badge" hidden></span></span><span class="tab-label">Visuals</span></a>
    </nav>
    <button id="live" class="live" type="button" data-state="wait" title="Tap to check now."><span class="live-dot" aria-hidden="true"></span><span id="live-text">Connecting</span></button>
  </div>
</header>
<div id="notice" class="notice" role="status" hidden></div>
<main id="view" aria-busy="true">
  <div class="page loading" aria-hidden="true">
    <div class="page-head"><div class="skeleton skeleton-title"></div></div>
    <div class="card"><div class="skeleton"></div><div class="skeleton short"></div></div>
    <div class="card"><div class="skeleton"></div><div class="skeleton short"></div></div>
    <div class="card"><div class="skeleton"></div><div class="skeleton short"></div></div>
  </div>
</main>
<noscript><p class="noscript">Aldermoor Live needs JavaScript to show GitHub's live state.</p></noscript>
</body>
</html>
