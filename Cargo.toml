[workspace]
resolver = "3"
members = ["crates/*"]
# A Swift package, built separately.
exclude = ["crates/apple"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
glam = { version = "0.34", features = ["serde"] }
bevy_ecs = { version = "0.20", default-features = false, features = ["std", "multi_threaded"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
crossbeam-channel = "0.5"
anim = { path = "crates/anim" }
world = { path = "crates/world" }
sim = { path = "crates/sim" }
protocol = { path = "crates/protocol" }
content = { path = "crates/content" }
server = { path = "crates/server" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Keep debug builds quick but not painfully slow at runtime.
[profile.dev]
opt-level = 1
# Line tables keep backtraces and debugger line steps for our crates at a fraction of full
# debuginfo, which grew agents' target folders by about 20 GB an hour on the Mac (#230). Release and
# the perf gate already use line tables. Set CARGO_PROFILE_DEV_DEBUG=full for a debugger session.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
