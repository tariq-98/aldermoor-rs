[workspace]
resolver = "3"
members = ["crates/*"]
# A Swift package, built separately.
exclude = ["crates/apple"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Keep debug builds quick but not painfully slow at runtime.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
