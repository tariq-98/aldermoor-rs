# Keeps labels and milestones in line with .github/tracking.json, files each issue under the
# milestone matching its phase:N label, and moves an issue's status label when a PR that closes it
# opens or is abandoned. Safe to run again at any time.
name: Tracking

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/tracking.json]
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

# A new issue fires one labeled event per label; queue them per issue so they don't race each
# other's milestone update.
concurrency:
  group: tracking-${{ github.event.issue.number || github.event.pull_request.number || 'all' }}

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  sync:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (github.event.action == 'opened' || startsWith(github.event.label.name, 'phase:')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/tracking.json
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('.github/tracking.json', 'utf8'));
            const repo = context.repo;
            const single = context.eventName === 'issues';

            if (!single) {
              for (const label of config.labels) {
                try {
                  await github.rest.issues.updateLabel({ ...repo, name: label.name, color: label.color, description: label.description });
                } catch (e) {
                  if (e.status !== 404) throw e;
                  await github.rest.issues.createLabel({ ...repo, ...label });
                }
              }
            }

            const existing = await github.paginate(github.rest.issues.listMilestones, { ...repo, state: 'all' });
            const byPhase = {};
            for (const m of config.milestones) {
              let found = existing.find(e => e.title === m.title);
              if (!found && !single) {
                found = (await github.rest.issues.createMilestone({ ...repo, title: m.title, description: m.description })).data;
              }
              if (found) byPhase[m.phase] = found.number;
            }

            const issues = single
              ? [context.payload.issue]
              : await github.paginate(github.rest.issues.listForRepo, { ...repo, state: 'open' });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const phase = issue.labels
                .map(l => (typeof l === 'string' ? l : l.name).match(/^phase:(\d)$/))
                .find(Boolean);
              const number = phase && byPhase[phase[1]];
              if (number && issue.milestone?.number !== number) {
                await github.rest.issues.update({ ...repo, issue_number: issue.number, milestone: number });
              }
            }

  # Agents without GitHub access (Codex cloud) can't move labels, so a PR that says "Closes #n"
  # does it for them: in review while the PR is open, back to ready if it closes unmerged.
  pull-request:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const pr = context.payload.pull_request;
            const refs = [...(pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
              .map(m => Number(m[1]));
            const status = ['status:ready', 'status:claimed', 'status:blocked', 'status:in-review'];

            for (const number of new Set(refs)) {
              const { data: issue } = await github.rest.issues.get({ ...repo, issue_number: number });
              if (issue.pull_request || issue.state !== 'open') continue;
              const labels = issue.labels.map(l => l.name);
              const keep = labels.filter(l => !status.includes(l));

              if (context.payload.action !== 'closed') {
                if (!labels.includes('status:claimed') && !labels.includes('status:in-review')) {
                  await github.rest.issues.createComment({ ...repo, issue_number: number,
                    body: `Claimed by PR #${pr.number} (branch \`${pr.head.ref}\`).` });
                }
                await github.rest.issues.setLabels({ ...repo, issue_number: number, labels: [...keep, 'status:in-review'] });
              } else if (!pr.merged && labels.includes('status:in-review')) {
                await github.rest.issues.createComment({ ...repo, issue_number: number,
                  body: `Released: PR #${pr.number} was closed without merging.` });
                await github.rest.issues.setLabels({ ...repo, issue_number: number, labels: [...keep, 'status:ready'] });
              }
            }
