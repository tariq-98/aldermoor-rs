# Codex never creates or edits assets or works in Blender (AGENTS.md, Ownership). Fails any PR from
# a codex/ branch that touches the art pipeline, built assets, asset tools or asset files.
name: Codex guard

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  no-assets:
    if: startsWith(github.head_ref, 'codex/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      # HEAD is the PR merged into main, and its first parent is main as that merge has it. The
      # event's base sha can be older (main moved while the checks started), and diffing from it
      # would blame the PR for whatever main changed since (#345).
      - name: Check changed paths
        run: |
          blocked=$(git diff --name-only HEAD^1 HEAD | grep -E \
            '^(art|assets|tools)/|^crates/assets/|\.(blend|blend1|glb|gltf|ktx2|png|jpe?g|tga|exr|hdr)$' || true)
          if [ -n "$blocked" ]; then
            echo "::error::Codex must not create or edit assets or Blender files (AGENTS.md, Ownership). Blocked paths:"
            echo "$blocked"
            exit 1
          fi
          echo "No asset or Blender paths touched."
