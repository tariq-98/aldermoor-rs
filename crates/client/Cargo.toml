[package]
name = "client"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
egui-winit = { version = "0.33", default-features = false }
egui = { version = "0.33", default-features = false, features = ["default_fonts"] }
assets = { path = "../assets" }
controls = { path = "../controls" }
anyhow = "1"
anim.workspace = true
glam.workspace = true
protocol.workspace = true
server.workspace = true
world.workspace = true
render = { path = "../render" }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVDisplayLink", "CVReturn", "objc2-core-graphics"] }
