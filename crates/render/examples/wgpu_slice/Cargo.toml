[package]
name = "aldermoor-wgpu-slice"
version = "0.1.0"
edition = "2024"
publish = false

# An isolated experiment: neither its dependencies nor its backend enter the game build.
[workspace]

[dependencies]
anyhow = "1"
assets = { path = "../../../assets" }
world = { path = "../../../world" }
protocol = { path = "../../../protocol" }
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = { version = "1.4", features = ["extras", "names", "KHR_materials_emissive_strength", "utils"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "wgsl"] }
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
render = { path = "../.." }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
